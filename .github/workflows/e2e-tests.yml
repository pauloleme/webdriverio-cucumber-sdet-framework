name: E2E Automation Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    name: Lint, Typecheck & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js (LTS v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Setup Java (required by Allure CLI)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type checking
        run: npm run typecheck

      - name: Run Tests
        id: full_tests
        env:
          CI: "true"
          HEADLESS: "true"
          PASSIVE_OBSERVER_ENABLED: "true"
        run: npm test

      - name: Verify Current-Run Validation Dashboard
        if: always() && steps.full_tests.outcome != 'skipped'
        run: npm run test:report:verify

      - name: Run E2E Tests (Smoke Suite)
        env:
          CI: "true"
          HEADLESS: "true"
          PASSIVE_OBSERVER_ENABLED: "true"
        run: npm run test:smoke

      - name: Generate Allure Report
        if: always()
        run: npm run report:generate

      - name: Archive Test Artifacts (Reports & Failure Screenshots)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-test-results
          path: |
            allure-report/
            allure-results/
            screenshots/
            artifacts/passive-evidence/
            artifacts/validation-report/
          retention-days: 14

      - name: Upload Standalone Validation Dashboard
        if: always() && steps.full_tests.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: validation-dashboard
          path: artifacts/validation-report/latest.html
          if-no-files-found: error
          retention-days: 14
